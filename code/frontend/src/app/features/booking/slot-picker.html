<section class="slot-picker">
  <h2 class="slot-picker__title" i18n="@@booking.slots.title">Choose a time</h2>

  <div class="field slot-picker__date">
    <label for="slot-picker-date" i18n="@@booking.slots.dateLabel">Date</label>
    <input
      id="slot-picker-date"
      type="date"
      class="slot-picker__date-input"
      [value]="date()"
      (change)="onDateChange($event)"
    />
  </div>

  @if (loading()) {
    <p
      class="notice slot-picker__loading"
      role="status"
      aria-busy="true"
      i18n="@@booking.slots.loading"
    >
      Loading available times
    </p>
  } @else if (error()) {
    <p class="notice notice--error slot-picker__error" role="alert" i18n="@@booking.slots.error">
      We could not load the available times. Please try again.
    </p>
  } @else if (!slots().length) {
    <p
      class="notice slot-picker__empty"
      role="status"
      aria-live="polite"
      i18n="@@booking.slots.empty"
    >
      No times available. Try another date or professional.
    </p>
  } @else {
    <ul class="slot-picker__options">
      @for (slot of slots(); track slot.startsAt) {
        <li>
          <button type="button" class="option slot-picker__option" (click)="chooseSlot(slot)">
            {{ slot.startsAt | date: 'shortTime' }}
          </button>
        </li>
      }
    </ul>
  }
</section>
